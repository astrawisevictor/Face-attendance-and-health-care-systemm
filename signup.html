<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />

  <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/3.3.0/mdb.min.css" rel="stylesheet" />
  <title>Đăng ký quản trị viên</title>
  <link rel="icon" type="image/x-icon" href="static/icon3.png">

</head>
<style>
  section {
    background-image: url('static/bg.jpg');
    background-attachment: fixed;
    background-size: cover;
  }
  .is-invalid { border-color: #dc3545 !important; background-image: none !important; }
  .is-valid { border-color: #28a745 !important; }
  .field-error { color: #dc3545; }
</style>

<body>

  <section class="vh-100" style="background-color: #eee;">
    <div class="container h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-lg-12 col-xl-11">
          <div class="card text-black" style="border-radius: 25px;">
            <div class="card-body p-md-5">
              <div class="row justify-content-center">
                <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">

                  <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Đăng ký quản trị viên</p>
                  <p class="text-center text-muted">Tài khoản Giáo viên/Học sinh vui lòng liên hệ quản trị viên để được thêm vào hệ thống qua mục "Quản lý".</p>

                  <form class="mx-1 mx-md-4" method="post" id="signupForm" novalidate>
                    {% if incorrect == True %}
                    <p style="color:red">{{msg}}</p>
                    {% endif %}
                    <div class="d-flex flex-row align-items-center mb-4">
  <i class="fas fa-thumbtack fa-lg me-3 fa-fw"></i>
  <div class="form-outline flex-fill mb-0">
    <input type="text" id="form3Example1c" class="form-control form-control-lg" name="id" required />
    <label class="form-label" for="form3Example1c">Mã số (số hoặc chữ)</label>
  </div>
</div>

                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0">
                        <input type="text" id="form3Example2c" name="name" class="form-control" required />
                        <label class="form-label" for="form3Example2c">Họ và tên</label>
                      </div>
                    </div>

                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-building fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0">
                        <input type="text" id="form3Example7c" name="workplace" class="form-control" required />
                        <label class="form-label" for="form3Example7c">Nơi công tác</label>
                      </div>
                    </div>

                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-id-badge fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0">
                        <input type="text" id="form3Example8c" name="position" class="form-control" required />
                        <label class="form-label" for="form3Example8c">Chức vụ</label>
                      </div>
                    </div>

                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-envelope fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0">
                        <input type="email" id="form3Example3c" name="mail" class="form-control" required />
                        <label class="form-label" for="form3Example3c">Email</label>
                      </div>
                    </div>

                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0">
                        <input type="text" id="form3Example4c" name="username" class="form-control" required />
                        <label class="form-label" for="form3Example4c">Tạo tên đăng nhập</label>
                      </div>
                    </div>

                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-lock fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0">
                        <input type="password" id="form3Example5c" name="pass" class="form-control" pattern=".{8,}"
                        title="Ít nhất 8 ký tự" required />
                        <label class="form-label" for="form3Example5c">Mật khẩu (ít nhất 8 ký tự)</label>
                      </div>
                    </div>

                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-key fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0">
                        <input type="password" id="form3Example6cd" class="form-control" name="pass2" required pattern=".{8,}"
                        title="Ít nhất 8 ký tự"/>
                        <label class="form-label" for="form3Example6cd">Nhập lại mật khẩu</label>
                      </div>
                    </div>

                    <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                      <button type="submit" class="btn btn-dark btn-lg">Đăng ký</button>
                    </div>

                  </form>

                </div>
                <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">

                  <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp"
                    class="img-fluid" alt="Sample image">

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/3.3.0/mdb.min.js"></script>
  <script>
    function fieldErrorMsg(el) {
      if (el.type === 'email') return 'Email không hợp lệ';
      if (el.name === 'pass') return 'Mật khẩu phải từ 8 ký tự trở lên';
      if (el.name === 'pass2') return 'Mật khẩu nhập lại không khớp';
      return 'Vui lòng nhập trường này';
    }
    function showFieldError(el, show, msg) {
      var box = el.closest('.form-outline') || el.parentElement;
      var errEl = box.querySelector('.field-error');
      if (!errEl) {
        errEl = document.createElement('div');
        errEl.className = 'field-error small mt-1';
        box.appendChild(errEl);
      }
      errEl.textContent = show ? msg : '';
      errEl.style.display = show ? '' : 'none';
    }
    function validateRequiredFields(form) {
      var ok = true;
      form.querySelectorAll('[required]').forEach(function(el) {
        var val = (el.value || '').trim();
        var fieldOk = val.length > 0;
        if (el.hasAttribute('pattern') && fieldOk) {
          try { fieldOk = new RegExp('^(?:' + el.getAttribute('pattern') + ')$').test(val); } catch (e) {}
        }
        if (el.type === 'email' && fieldOk) {
          fieldOk = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val);
        }
        el.classList.remove('is-invalid', 'is-valid');
        if (!fieldOk) { el.classList.add('is-invalid'); ok = false; showFieldError(el, true, fieldErrorMsg(el)); }
        else { el.classList.add('is-valid'); showFieldError(el, false, ''); }
      });
      var pass = form.querySelector('input[name="pass"]');
      var pass2 = form.querySelector('input[name="pass2"]');
      if (pass && pass2 && pass.value && pass2.value && pass.value !== pass2.value) {
        pass2.classList.add('is-invalid');
        pass2.classList.remove('is-valid');
        showFieldError(pass2, true, fieldErrorMsg(pass2));
        ok = false;
      }
      return ok;
    }
    var signupForm = document.getElementById('signupForm');
    signupForm.querySelectorAll('input[name]').forEach(function(el) {
      el.addEventListener('input', function() { el.classList.remove('is-invalid'); showFieldError(el, false, ''); });
    });
    signupForm.addEventListener('submit', function(e) {
      if (!validateRequiredFields(signupForm)) {
        e.preventDefault();
        var firstInvalid = signupForm.querySelector('.is-invalid');
        if (firstInvalid) firstInvalid.focus();
        return false;
      }
    });
  </script>
</body>

</html>
