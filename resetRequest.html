<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/3.3.0/mdb.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <title>Quên mật khẩu</title>
  <link rel="icon" type="image/x-icon" href="static/icon3.png">
</head>
<style>
    section {
        background-image: url('static/bg.jpg');
        background-attachment: fixed;
        background-size: cover;
    }
</style>

<body>
    <section class="vh-100">
        <div class="container py-5 h-auto">
            <center>
                <div class="row d-flex justify-content-center align-items-center h-auto w-50" style="margin-top: 10vh;">
                    <div class="card" style="border-radius: 1rem;">
                        <div class="row g-0">
                            <div class="card-body p-4 p-lg-5 text-black">
                                <div class="form-section"></div>
                                <form method="post" action="/reset_request">
                                    <div class="d-flex align-items-center mb-3 pb-1">
                                        <i class="fas fa-unlock-alt fa-2x me-3"></i>
                                        <span class="h1 fw-bold mb-0">Quên mật khẩu</span>
                                    </div>
                                    <p class="text-muted">Vui lòng nhập đầy đủ 4 thông tin bên dưới, tất cả phải khớp với tài khoản của bạn.</p>
                                    {% if incorrect == True %}
                                    <p style="color:red"><b>{{ msg }}</b></p>
                                    {% endif %}

                                    <div class="form-outline mb-4">
                                        <input type="text" id="username" name="username"
                                            class="form-control form-control-lg" required />
                                        <label class="form-label" for="username">Tên đăng nhập</label>
                                    </div>
                                    <div class="form-outline mb-4">
                                        <input type="text" id="id" name="id"
                                            class="form-control form-control-lg" required />
                                        <label class="form-label" for="id">Mã số</label>
                                    </div>
                                    <div class="form-outline mb-4">
                                        <input type="text" id="name" name="name"
                                            class="form-control form-control-lg" required />
                                        <label class="form-label" for="name">Họ và tên</label>
                                    </div>
                                    <div class="form-outline mb-4">
                                        <input type="email" id="mail" name="mail"
                                            class="form-control form-control-lg" required />
                                        <label class="form-label" for="mail">Email</label>
                                    </div>

                                    <div class="pt-1 mb-4">
                                        <button type="submit" class="btn btn-dark btn-lg btn-block">Gửi mã OTP</button>
                                    </div>
                                    <a class="small text-muted" href="/login">Quay lại đăng nhập</a>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </center>
        </div>
    </section>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/3.3.0/mdb.min.js"></script>
</body>

</html>
