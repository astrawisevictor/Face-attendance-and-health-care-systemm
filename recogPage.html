<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <title>Nhận diện khuôn mặt — Điểm danh</title>
    <link rel="icon" type="image/x-icon" href="static/icon3.png">
</head>
<style>
    .log {
        color: white;
        text-decoration: none;
    }
    .log:hover {
        color: blue;
        text-decoration: none;
    }
    #statusLine {
        color: #eee;
        text-align: center;
        margin-top: 8px;
        font-family: monospace;
    }
    #camWrap {
        position: relative;
        width: 640px;
        max-width: 100%;
    }
    #cam, #overlay {
        border: 2px solid white;
        border-radius: 6px;
        width: 100%;
        display: block;
    }
    #overlay {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        border-color: transparent;
    }
</style>
<body class="bg-image" style="background-image: url('/static/bg.jpg'); height: 100vh;">
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/"><img src="static/icon3.png" width="35" class="d-inline-block align-top"
                alt="logo">
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">
                <li>
                    <h6 style="color: white;">Nhận diện khuôn mặt — Điểm danh nhân viên</h6>
                </li>
            </ul>
            <div class="form-inline my-2 my-lg-0">
                <a href="/sessions" class="mr-5 mt-2 log"><h6>Buổi điểm danh</h6></a>
                <a href="/logout" class="mr-5 mt-2 log">
                    <h6>Đăng xuất</h6>
                </a>
                <h6 class="my-2 my-sm-0" style="color: white;">Xin chào, {{current_user.username}}</h6>
            </div>
        </div>
    </nav>
    <!-- camera window -->
    <div>
        <div style="justify-content: center; display: flex; margin-top: 15px;">
            <div id="camWrap">
                <video id="cam" autoplay playsinline muted></video>
                <!-- Canvas trong suốt vẽ khung xanh/đỏ từ toạ độ server trả
                     về — nhẹ hơn nhiều so với việc nhận ảnh đã vẽ sẵn. -->
                <canvas id="overlay"></canvas>
            </div>
        </div>
        <div id="statusLine">Chưa bắt đầu.</div>
        <div style="text-align:center; margin-top:12px;">
            <button type="button" class="btn btn-dark" id="startBtn" onclick="startRecognition()">Bắt đầu nhận diện</button>
            <button type="button" class="btn btn-outline-danger" id="homeBtn" onclick="backToHome()">Quay về trang chủ</button>
        </div>
        <p class="text-center text-muted mt-2" style="font-size: 0.85em;">
            Khi hiện khung xanh, hệ thống tự động ghi nhận điểm danh ngay lập tức — không cần chờ thao tác nào thêm.
        </p>
    </div>
    <script>
        let recognitionStream = null;
        let recognitionVideo = null;
        let overlayCanvas = null;
        let recognitionTimer = null;
        let busy = false; 
        const POLL_INTERVAL_MS = 1500;
        function drawBoxes(faces) {
            const ctx = overlayCanvas.getContext('2d');
            ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            if (!faces) return;
            faces.forEach(f => {
                const [x1, y1, x2, y2] = f.box;
                let color = '#ff3333';
                let label = 'Không xác định';
                if (f.status === 'known') {
                    color = '#33ff55';
                    label = (f.name || f.id || 'Đã nhận diện') + (f.confidence != null ? ` (${f.confidence}%)` : '');
                } else if (f.status === 'ambiguous') {
                    color = '#ffaa00';
                    label = 'Chưa rõ — 2 người giống nhau';
                } else if (f.status === 'no_encoding') {
                    color = '#ff3333';
                    label = 'Chưa có dữ liệu khuôn mặt';
                }
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
                ctx.font = '16px monospace';
                const textY = Math.min(y2 + 18, overlayCanvas.height - 4);
                const textW = ctx.measureText(label).width + 8;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(x1, textY - 14, textW, 18);
                ctx.fillStyle = color;
                ctx.fillText(label, x1 + 4, textY);
            });
        }

        async function startRecognition() {
            recognitionVideo = document.getElementById('cam');
            overlayCanvas = document.getElementById('overlay');
            const statusLine = document.getElementById('statusLine');
            document.getElementById('startBtn').disabled = true;

            try {
                recognitionStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                recognitionVideo.srcObject = recognitionStream;
                await recognitionVideo.play();

                overlayCanvas.width = recognitionVideo.videoWidth || 640;
                overlayCanvas.height = recognitionVideo.videoHeight || 480;

                statusLine.innerText = "Đang nhận diện...";

                if (recognitionTimer) clearInterval(recognitionTimer);
                recognitionTimer = setInterval(async () => {
                    if (busy) return;
                    busy = true;
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = recognitionVideo.videoWidth || 640;
                        canvas.height = recognitionVideo.videoHeight || 480;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(recognitionVideo, 0, 0, canvas.width, canvas.height);
                        const image = canvas.toDataURL('image/jpeg', 0.85);

                        const response = await fetch('/recognize_frame', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ image })
                        });
                        const result = await response.json();

                        drawBoxes(result.faces);

                        if (result.error) {
                            statusLine.innerText = "Lỗi: " + result.error;
                        } else if (result.recognized) {
                            statusLine.innerText = "✅ Đã ghi nhận điểm danh: " + result.name + " (" + result.id + ")";
                        } else if (result.faces && result.faces.length > 0) {
                            statusLine.innerText = "Phát hiện " + result.faces.length + " khuôn mặt — chưa khớp ai trong hệ thống.";
                        } else {
                            statusLine.innerText = "Không phát hiện khuôn mặt nào trong khung hình.";
                        }
                    } catch (err) {
                        statusLine.innerText = "Lỗi kết nối tới máy chủ: " + err;
                    } finally {
                        busy = false;
                    }
                }, POLL_INTERVAL_MS);
            } catch (err) {
                statusLine.innerText = "Không truy cập được camera (bị từ chối quyền, hoặc không có camera).";
                document.getElementById('startBtn').disabled = false;
            }
        }

        function stopCamera() {
            if (recognitionTimer) {
                clearInterval(recognitionTimer);
                recognitionTimer = null;
            }
            if (recognitionStream) {
                recognitionStream.getTracks().forEach(t => t.stop());
                recognitionStream = null;
            }
        }
        function backToHome() {
            stopCamera();
            window.location.href = '/';
        }
        window.addEventListener('beforeunload', stopCamera);
    </script>
    <!-- jQuery, Popper, Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
